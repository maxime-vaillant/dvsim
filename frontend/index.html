<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Dataset</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="loading">
        Loading 3D Object...
    </div>
    <div id="guiContainer"></div>
    <div id="panelLabels" aria-hidden="true"></div>
    <pre id="cameraInfo" title="View camera: position, heading and trajectory time" hidden></pre>
    <div id="jobPanel" hidden>
        <div class="job-header">
            <strong id="jobStatus" aria-live="polite"></strong>
            <button id="jobDismiss" type="button" title="Hide" aria-label="Hide">&times;</button>
        </div>
        <progress id="jobProgress" max="1"></progress>
        <div id="jobDetail"></div>
        <div id="jobError" hidden></div>
        <ul id="jobFiles"></ul>
        <button id="jobCancel" type="button" hidden>Cancel</button>
    </div>
    <div id="notice" role="status" hidden></div>
    <script type="module" src="src/main.js"></script>
    <input type="file" id="objFileInput" accept=".obj,.mtl,.png,.jpg,.jpeg" multiple />
    <input type="file" id="trajectoryFileInput" accept=".json" />
</body>
</html>
